
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workforce OS | Futuristic Productivity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --bg-main: #020617;
            --bg-card: rgba(15, 23, 42, 0.6);
            --border: rgba(30, 41, 59, 0.7);
            --text-accent: #818cf8;
            --glass-bg: rgba(15, 23, 42, 0.4);
            --glass-border: rgba(255, 255, 255, 0.05);
        }

        .theme-cyberpunk {
            --primary: #f0abfc;
            --primary-glow: rgba(240, 171, 252, 0.4);
            --bg-main: #0a0a0a;
            --bg-card: rgba(23, 23, 23, 0.8);
            --border: rgba(162, 28, 175, 0.4);
            --text-accent: #e879f9;
        }

        .theme-emerald {
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.4);
            --bg-main: #022c22;
            --bg-card: rgba(6, 78, 59, 0.4);
            --border: rgba(16, 185, 129, 0.3);
            --text-accent: #34d399;
        }

        .theme-crimson {
            --primary: #e11d48;
            --primary-glow: rgba(225, 29, 72, 0.4);
            --bg-main: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.6);
            --border: rgba(225, 29, 72, 0.3);
            --text-accent: #fb7185;
        }

        .theme-nordic {
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.4);
            --bg-main: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.5);
            --border: rgba(56, 189, 248, 0.2);
            --text-accent: #7dd3fc;
        }

        .theme-light {
            --primary: #4f46e5;
            --primary-glow: rgba(79, 70, 229, 0.15);
            --bg-main: #f8fafc;
            --bg-card: rgba(255, 255, 255, 0.9);
            --border: #e2e8f0;
            --text-accent: #4338ca;
            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
            background-color: var(--bg-main);
            color: #f1f5f9;
            transition: background-color 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .theme-light body { color: #0f172a; }

        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; color: black !important; }
        }
        
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 20px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.4); }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.1);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
            box-shadow: 0 0 10px var(--primary-glow);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: var(--text-accent);
        }

        .app-bg {
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at top right, var(--primary-glow), transparent 40%);
        }

        .glass-panel {
            background: var(--bg-card);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
        }

        .text-glow {
            text-shadow: 0 0 10px var(--primary-glow);
        }

        .stat-card-gradient {
            background: linear-gradient(135deg, var(--bg-card) 0%, rgba(15, 23, 42, 0.2) 100%);
        }

        .accent-shadow {
            box-shadow: 0 0 30px -5px var(--primary-glow);
        }

        @keyframes pulse-border {
            0%, 100% { border-color: var(--border); }
            50% { border-color: var(--primary); }
        }

        .border-pulse {
            animation: pulse-border 3s infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .float-anim {
            animation: float 6s ease-in-out infinite;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "xlsx": "https://esm.sh/xlsx@^0.18.5",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "vite": "https://esm.sh/vite@^7.3.1",
    "jspdf": "https://esm.sh/jspdf@^4.0.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^0.21.0"
  }
}
</script>
</head>
<body class="min-h-screen selection:bg-indigo-500/30">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
